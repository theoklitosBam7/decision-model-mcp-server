name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run lint:check
      - run: pnpm exec oxfmt src/response.ts test/security.test.ts && git diff -- src/response.ts test/security.test.ts && exit 1
      - run: pnpm run typecheck
      - run: pnpm run build
